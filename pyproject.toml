[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vev-audit"
version = "1.0.0"
description = "Automated WCAG 2.2 website accessibility auditing by Vevkraft."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vevkraft" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "playwright>=1.48",
    "jinja2>=3.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["vev_audit*"]

[tool.setuptools.package-data]
vev_audit = ["vendor/*", "reports/templates/*", "reports/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["browser: tests that launch headless Chromium (deselect with -m 'not browser')"]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
